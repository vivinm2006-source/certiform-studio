version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certiform-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///certiform.db
      - PUBLIC_BASE_URL=http://localhost:5173
      - DEFAULT_DPI=300
    volumes:
      - certiform-storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: certiform-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  certiform-storage:
